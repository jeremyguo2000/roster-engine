# Default values for roster-engine.
#
# Three values are REQUIRED and have no defaults (install fails with a clear
# error if unset): auth.secretKey, postgres.password, mcp.servicePassword.

image:
  # Registry prefix for the two app images, e.g. "harbor.example.com/roster".
  # Leave empty if the repository names below are already fully qualified or
  # the images are loaded directly onto the nodes.
  registry: ""
  backendRepository: roster-backend
  frontendRepository: roster-frontend
  tag: "0.2.0"
  pullPolicy: IfNotPresent
  # e.g. pullSecrets: [{ name: regcred }]
  pullSecrets: []

auth:
  # JWT signing key. Generate with: openssl rand -hex 32
  secretKey: ""
  accessTokenExpireMinutes: 1440

  # First web-UI login, created by a post-install job. The API rejects every
  # request without a login and there is no default account, so leaving the
  # password empty means you must create the first user by hand:
  #   kubectl exec deploy/<release>-roster-engine-backend -- \
  #     python -m app.scripts.create_user <name> <password>
  # Set the password here and the install does it for you. Existing users are
  # left alone, so it is safe to redeploy.
  initialAdmin:
    username: admin
    password: ""

postgres:
  user: roster
  password: ""
  database: roster_engine
  persistence:
    size: 5Gi
    # Empty string uses the cluster's default StorageClass.
    storageClassName: ""
  resources: {}

redis:
  resources: {}

backend:
  resources: {}

worker:
  # Solver processes per worker pod. Scale solves by adding replicas, not
  # concurrency — CP-SAT saturates CPU per solve.
  concurrency: 1
  replicas: 1
  resources: {}

mcp:
  enabled: true
  # Service account the MCP server logs in with. The user must be created
  # after install (see DEPLOY.md) with exactly these credentials.
  serviceUsername: svc-mcp
  servicePassword: ""
  resources: {}

# In-app scheduling assistant (the chat widget). Optional: when disabled, or when
# left unconfigured, /api/chat returns 503 and the UI hides the widget entirely —
# the rest of the app is unaffected.
chat:
  enabled: false

  # "anthropic" — the Claude API. Best answer quality, but the backend pod needs
  #   egress to https://api.anthropic.com, and roster contents (including staff
  #   names) leave the cluster.
  # "openai"    — any endpoint speaking OpenAI's /v1/chat/completions with tool
  #   calling. This is the on-prem option: nothing leaves the cluster. HPE PCAI
  #   serves models this way (vllm/vllm-openai with --enable-auto-tool-choice), as
  #   do NVIDIA NIM and Ollama. Despite the name, no request goes to OpenAI.
  provider: anthropic

  # provider: anthropic
  anthropicApiKey: ""  # from https://console.anthropic.com/settings/keys

  # provider: openai — baseUrl and model are both required.
  # baseUrl is the in-cluster endpoint including /v1, e.g.
  #   http://my-llm-predictor.my-namespace.svc.cluster.local:8080/v1
  baseUrl: ""
  # The model name the endpoint serves, e.g. "llama-3.3-70b-instruct". Pick one
  # validated for tool calling — the assistant is useless without it.
  model: ""
  # Often unset: in-cluster endpoints are frequently unauthenticated.
  apiKey: ""

frontend:
  service:
    # Set to NodePort for quick access on clusters without an ingress controller.
    type: ClusterIP
  resources: {}

# Standard Kubernetes Ingress (for non-PCAI clusters). All traffic goes to the
# frontend, whose nginx proxies /api, /documentation and /mcp internally.
ingress:
  enabled: false
  className: ""
  host: roster.example.com
  annotations: {}
  tls: []

# HPE PCAI / AI Essentials integration. When enabled, an Istio VirtualService
# under templates/ezua/ exposes the app through the platform's gateway.
# ${DOMAIN_NAME} is substituted by AI Essentials at import time.
ezua:
  enabled: false
  virtualService:
    endpoint: "roster.${DOMAIN_NAME}"
    istioGateway: "istio-system/ezaf-gateway"
